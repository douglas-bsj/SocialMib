# Mib Social — Stack para o Portainer via REPOSITÓRIO GIT
# O Portainer clona o repositório e gera as imagens (build) no próprio servidor.
# Deploy: Stacks → Add stack → Repository → Compose path: docker-compose.portainer.yml
# Atualizar: na stack, "Pull and redeploy" (marque "Re-pull image and redeploy" / rebuild).
# Segredos vêm do Env da stack no Portainer (nunca versionar valores reais aqui).

services:

  # ── PostgreSQL ──────────────────────────────────────────────────────────────
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-socialpost}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-socialpost}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-socialpost}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Redis ───────────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD}
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Next.js App ─────────────────────────────────────────────────────────────
  app:
    build:
      context: .
      target: app
    image: mibsocial-app:v5
    # Imagem local (gerada no servidor): nunca tentar baixar do Docker Hub,
    # senão "Re-pull image" falha com "pull access denied".
    pull_policy: build
    restart: unless-stopped
    ports:
      - "8090:3000"
    environment:
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: ${REDIS_URL}
      AUTH_SECRET: ${AUTH_SECRET}
      NEXTAUTH_URL: ${NEXTAUTH_URL}
      # NextAuth v5 rejeita hosts não-padrão (acesso por IP:porta) sem isto → UntrustedHost/500.
      AUTH_TRUST_HOST: ${AUTH_TRUST_HOST:-true}
      # Cadastro público (/register). Fechado por padrão: só dono/admin criam contas em
      # Configurações → Membros. Defina "true" no Env da stack para reabrir.
      ALLOW_PUBLIC_REGISTER: ${ALLOW_PUBLIC_REGISTER:-false}
      NODE_ENV: production
      # Imagens enviadas (sem S3) ficam no volume "uploads" e sobrevivem ao redeploy.
      UPLOAD_DIR: /app/uploads
      # Opcional: storage S3 (R2, MinIO...). Com S3_BUCKET + S3_ENDPOINT, o volume deixa de ser usado.
      S3_ENDPOINT: ${S3_ENDPOINT:-}
      S3_BUCKET: ${S3_BUCKET:-}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-}
      S3_REGION: ${S3_REGION:-}
      S3_PUBLIC_URL: ${S3_PUBLIC_URL:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-sk-dummy}
      RESEND_API_KEY: ${RESEND_API_KEY:-re_dummy}
      # ── E-mail (recuperação de senha, convites) ──
      # SMTP do e-mail da empresa. Ex. Microsoft 365: smtp.office365.com / 587
      #                            Ex. Gmail:         smtp.gmail.com / 587 (senha de app)
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_SECURE: ${SMTP_SECURE:-}
      # Remetente; vazio = usa o SMTP_USER. Ex.: "Mib Social <contato@empresa.com.br>"
      EMAIL_FROM: ${EMAIL_FROM:-}
      # ── Credenciais OAuth das redes sociais ──
      # Sem elas o botão "Conectar" da plataforma fica como "Não configurado".
      # Callback a cadastrar em cada app: ${NEXTAUTH_URL}/api/social/<plataforma>/callback
      TWITTER_CLIENT_ID: ${TWITTER_CLIENT_ID:-}
      TWITTER_CLIENT_SECRET: ${TWITTER_CLIENT_SECRET:-}
      INSTAGRAM_CLIENT_ID: ${INSTAGRAM_CLIENT_ID:-}
      INSTAGRAM_CLIENT_SECRET: ${INSTAGRAM_CLIENT_SECRET:-}
      FACEBOOK_CLIENT_ID: ${FACEBOOK_CLIENT_ID:-}
      FACEBOOK_CLIENT_SECRET: ${FACEBOOK_CLIENT_SECRET:-}
      LINKEDIN_CLIENT_ID: ${LINKEDIN_CLIENT_ID:-}
      LINKEDIN_CLIENT_SECRET: ${LINKEDIN_CLIENT_SECRET:-}
      TIKTOK_CLIENT_KEY: ${TIKTOK_CLIENT_KEY:-}
      TIKTOK_CLIENT_SECRET: ${TIKTOK_CLIENT_SECRET:-}
      YOUTUBE_CLIENT_ID: ${YOUTUBE_CLIENT_ID:-}
      YOUTUBE_CLIENT_SECRET: ${YOUTUBE_CLIENT_SECRET:-}
      PINTEREST_APP_ID: ${PINTEREST_APP_ID:-}
      PINTEREST_APP_SECRET: ${PINTEREST_APP_SECRET:-}
      THREADS_CLIENT_ID: ${THREADS_CLIENT_ID:-}
      THREADS_CLIENT_SECRET: ${THREADS_CLIENT_SECRET:-}
      REDDIT_CLIENT_ID: ${REDDIT_CLIENT_ID:-}
      REDDIT_CLIENT_SECRET: ${REDDIT_CLIENT_SECRET:-}
    volumes:
      - uploads:/app/uploads
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      # 127.0.0.1 (não "localhost"): o app liga só em IPv4 (HOSTNAME=0.0.0.0);
      # "localhost" pode resolver ::1 (IPv6) no container → Connection refused (falso-negativo).
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/api/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # ── BullMQ Worker ───────────────────────────────────────────────────────────
  worker:
    build:
      context: .
      target: worker
    image: mibsocial-worker:v5
    pull_policy: build
    restart: unless-stopped
    environment:
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: ${REDIS_URL}
      # URL pública do app: as imagens enviadas (/uploads/...) viram links completos
      # para o worker baixá-las e para Instagram/Facebook/etc. buscarem.
      NEXTAUTH_URL: ${NEXTAUTH_URL}
      # O token do TikTok dura poucas horas: o worker renova antes de publicar.
      TIKTOK_CLIENT_KEY: ${TIKTOK_CLIENT_KEY:-}
      TIKTOK_CLIENT_SECRET: ${TIKTOK_CLIENT_SECRET:-}
      # O token do Google (YouTube) dura 1 hora: o worker renova antes de publicar.
      YOUTUBE_CLIENT_ID: ${YOUTUBE_CLIENT_ID:-}
      YOUTUBE_CLIENT_SECRET: ${YOUTUBE_CLIENT_SECRET:-}
      # Opcional: versão da API do LinkedIn (AAAAMM). Vazio = padrão do código.
      LINKEDIN_API_VERSION: ${LINKEDIN_API_VERSION:-}
      NODE_ENV: production
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  # ── Seed one-shot: cria o admin de teste e sai ───────────────────────────────
  # Roda uma vez no deploy; fica como "exited(0)" (comportamento esperado).
  # create-admin.ts é idempotente (atualiza se já existir).
  seed:
    build:
      context: .
      target: worker
    image: mibsocial-worker:v5
    pull_policy: build
    restart: "no"
    command: ["node_modules/.bin/tsx", "scripts/create-admin.ts"]
    environment:
      DATABASE_URL: ${DATABASE_URL}
      # Senha usada só ao CRIAR o admin. Para recuperar o acesso, defina
      # ADMIN_RESET_PASSWORD=true, reimplante uma vez e depois apague.
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      ADMIN_RESET_PASSWORD: ${ADMIN_RESET_PASSWORD:-false}
      NODE_ENV: production
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
  redisdata:
  uploads:
