# Mib Social — Stack para o Portainer via REPOSITÓRIO GIT (servidor 192.168.50.242)
# O Portainer clona o repositório e gera as imagens (build) no próprio servidor.
# Deploy: Stacks → Add stack → Repository → Compose path: docker-compose.portainer.yml
# Atualizar: na stack, "Pull and redeploy" (marque "Re-pull image and redeploy" / rebuild).
# Segredos vêm do Env da stack no Portainer (nunca versionar valores reais aqui).

services:

  # ── PostgreSQL ──────────────────────────────────────────────────────────────
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-socialpost}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-socialpost}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-socialpost}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Redis ───────────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD}
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Next.js App ─────────────────────────────────────────────────────────────
  app:
    build:
      context: .
      target: app
    image: mibsocial-app:latest
    restart: unless-stopped
    ports:
      - "8090:3000"
    environment:
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: ${REDIS_URL}
      AUTH_SECRET: ${AUTH_SECRET}
      NEXTAUTH_URL: ${NEXTAUTH_URL}
      # NextAuth v5 rejeita hosts não-padrão (acesso por IP:porta) sem isto → UntrustedHost/500.
      AUTH_TRUST_HOST: ${AUTH_TRUST_HOST:-true}
      NODE_ENV: production
      OPENAI_API_KEY: ${OPENAI_API_KEY:-sk-dummy}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-sk_test_dummy}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-whsec_dummy}
      STRIPE_PRO_PRICE_ID: ${STRIPE_PRO_PRICE_ID:-price_dummy}
      STRIPE_AGENCY_PRICE_ID: ${STRIPE_AGENCY_PRICE_ID:-price_dummy}
      RESEND_API_KEY: ${RESEND_API_KEY:-re_dummy}
      EMAIL_FROM: ${EMAIL_FROM:-noreply@socialpost.local}
      # ── Credenciais OAuth das redes sociais ──
      # Sem elas o botão "Conectar" da plataforma fica como "Não configurado".
      # Callback a cadastrar em cada app: ${NEXTAUTH_URL}/api/social/<plataforma>/callback
      TWITTER_CLIENT_ID: ${TWITTER_CLIENT_ID:-}
      TWITTER_CLIENT_SECRET: ${TWITTER_CLIENT_SECRET:-}
      INSTAGRAM_CLIENT_ID: ${INSTAGRAM_CLIENT_ID:-}
      INSTAGRAM_CLIENT_SECRET: ${INSTAGRAM_CLIENT_SECRET:-}
      FACEBOOK_CLIENT_ID: ${FACEBOOK_CLIENT_ID:-}
      FACEBOOK_CLIENT_SECRET: ${FACEBOOK_CLIENT_SECRET:-}
      LINKEDIN_CLIENT_ID: ${LINKEDIN_CLIENT_ID:-}
      LINKEDIN_CLIENT_SECRET: ${LINKEDIN_CLIENT_SECRET:-}
      TIKTOK_CLIENT_KEY: ${TIKTOK_CLIENT_KEY:-}
      TIKTOK_CLIENT_SECRET: ${TIKTOK_CLIENT_SECRET:-}
      YOUTUBE_CLIENT_ID: ${YOUTUBE_CLIENT_ID:-}
      YOUTUBE_CLIENT_SECRET: ${YOUTUBE_CLIENT_SECRET:-}
      PINTEREST_APP_ID: ${PINTEREST_APP_ID:-}
      PINTEREST_APP_SECRET: ${PINTEREST_APP_SECRET:-}
      THREADS_CLIENT_ID: ${THREADS_CLIENT_ID:-}
      THREADS_CLIENT_SECRET: ${THREADS_CLIENT_SECRET:-}
      REDDIT_CLIENT_ID: ${REDDIT_CLIENT_ID:-}
      REDDIT_CLIENT_SECRET: ${REDDIT_CLIENT_SECRET:-}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      # 127.0.0.1 (não "localhost"): o app liga só em IPv4 (HOSTNAME=0.0.0.0);
      # "localhost" pode resolver ::1 (IPv6) no container → Connection refused (falso-negativo).
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/api/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # ── BullMQ Worker ───────────────────────────────────────────────────────────
  worker:
    build:
      context: .
      target: worker
    image: mibsocial-worker:latest
    restart: unless-stopped
    environment:
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: ${REDIS_URL}
      NODE_ENV: production
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  # ── Seed one-shot: cria o admin de teste e sai ───────────────────────────────
  # Roda uma vez no deploy; fica como "exited(0)" (comportamento esperado).
  # create-admin.ts é idempotente (atualiza se já existir).
  seed:
    build:
      context: .
      target: worker
    image: mibsocial-worker:latest
    restart: "no"
    command: ["node_modules/.bin/tsx", "scripts/create-admin.ts"]
    environment:
      DATABASE_URL: ${DATABASE_URL}
      NODE_ENV: production
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
  redisdata:
